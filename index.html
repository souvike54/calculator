<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Calculator UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #e9eef6, #dce6f5);
    }

    .calculator {
      width: 380px;
      background: #1f2433;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .display {
      width: 100%;
      background: #111522;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
      color: #fff;
      text-align: right;
      overflow: hidden;
    }

    .operation {
      min-height: 22px;
      font-size: 14px;
      color: #9aa3b2;
      word-break: break-all;
      margin-bottom: 8px;
    }

    .result {
      min-height: 48px;
      font-size: 34px;
      font-weight: bold;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      border: none;
      outline: none;
      border-radius: 16px;
      background: #2c3345;
      color: #fff;
      cursor: pointer;
      padding: 16px 10px;
      min-height: 86px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s ease;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .emoji {
      font-size: 20px;
      line-height: 1;
    }

    .symbol {
      font-size: 24px;
      font-weight: bold;
      line-height: 1;
    }

    .num .emoji {
      font-size: 18px;
    }

    .special {
      background: #394157;
    }

    .op {
      background: #24314f;
      color: #09d18b;
    }

    .equal {
      background: #09d18b;
      color: #062118;
      font-weight: bold;
    }

    .zero {
      grid-column: span 2;
    }

    .wide {
      min-height: 86px;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div id="operation" class="operation"></div>
      <div id="result" class="result">0</div>
    </div>

    <div class="buttons">
      <button class="btn special wide">
        <span class="emoji">🧹</span>
        <span class="symbol">AC</span>
      </button>
      <button class="btn special wide">
        <span class="emoji">🙄</span>
        <span class="symbol">C</span>
      </button>
      <button class="btn special wide">
        <span class="emoji">%</span>
        <span class="symbol">%</span>
      </button>
      <button class="btn op wide">
        <span class="emoji">➗</span>
        <span class="symbol">÷</span>
      </button>

      <button class="btn num">
        <span class="emoji">😄</span>
        <span class="symbol">7</span>
      </button>
      <button class="btn num">
        <span class="emoji">😃</span>
        <span class="symbol">8</span>
      </button>
      <button class="btn num">
        <span class="emoji">😆</span>
        <span class="symbol">9</span>
      </button>
      <button class="btn op">
        <span class="emoji">✖️</span>
        <span class="symbol">×</span>
      </button>

      <button class="btn num">
        <span class="emoji">🙂</span>
        <span class="symbol">4</span>
      </button>
      <button class="btn num">
        <span class="emoji">😉</span>
        <span class="symbol">5</span>
      </button>
      <button class="btn num">
        <span class="emoji">😊</span>
        <span class="symbol">6</span>
      </button>
      <button class="btn op">
        <span class="emoji">➖</span>
        <span class="symbol">−</span>
      </button>

      <button class="btn num">
        <span class="emoji">👈</span>
        <span class="symbol">1</span>
      </button>
      <button class="btn num">
        <span class="emoji">✌️</span>
        <span class="symbol">2</span>
      </button>
      <button class="btn num">
        <span class="emoji">👌</span>
        <span class="symbol">3</span>
      </button>
      <button class="btn op">
        <span class="emoji">➕</span>
        <span class="symbol">+</span>
      </button>

      <button class="btn num zero">
        <span class="emoji">0️⃣</span>
        <span class="symbol">0</span>
      </button>
      <button class="btn num">
        <span class="emoji">.</span>
        <span class="symbol">.</span>
      </button>
      <button class="btn equal">
        <span class="emoji">✅</span>
        <span class="symbol">=</span>
      </button>
    </div>
  </div>
</body>
</html>
